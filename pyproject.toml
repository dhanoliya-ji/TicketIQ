[project]
name = "ticketiq"
version = "1.0.0"
description = "Self-optimizing support ticket triage agent."
requires-python = ">=3.10"

# ---------------------------------------------------------------------------
# black: code formatter. 100 characters keeps the pipeline code readable
# without forcing awkward line breaks.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]

# ---------------------------------------------------------------------------
# ruff: linter.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # common bugs (bugbear)
    "UP",  # outdated syntax
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use assert-heavy, longer helper functions.
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------
# mypy: static type checking. The application code is fully annotated, so this
# runs clean; tests are excluded because their fixtures and monkeypatching add
# noise without adding safety.
#
# There is deliberately no `python_version` here, so mypy targets whichever
# interpreter it is running under. Pinning it to the project floor (3.10) broke
# CI on Python 3.12: pip resolves a newer numpy there, whose type stubs use the
# PEP 695 `type X = ...` statement, and mypy rejected that as "only supported in
# Python 3.12 and greater" because it had been told to target 3.10. A dependency
# is entitled to use syntax as new as the interpreter it was installed for.
#
# Keeping *our* code compatible with 3.10 is ruff's job instead - see
# `target-version = "py310"` above, which checks the source we actually own.
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["app"]
ignore_missing_imports = true     # vaderSentiment ships no type stubs
warn_unused_ignores = true
warn_redundant_casts = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repository root on sys.path so `import app` works.
#
# `python -m pytest` adds the current directory automatically, but the bare
# `pytest` command does not - it only adds the test folder. Without this line
# the suite passes when run one way and fails with "No module named 'app'"
# when run the other, which is exactly what happened the first time CI ran.
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
