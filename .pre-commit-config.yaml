# Run with:  pre-commit install   (then hooks run on every `git commit`)
# Or on the whole repo:  pre-commit run --all-files
#
# The revisions below MUST match the pinned versions in requirements-dev.txt.
# They are the same tools CI runs, and a version gap is not cosmetic: black
# 24.8.0 and 26.5.1 format `connection.execute("""...""")` differently, so a
# developer running pre-commit produced a file that CI's black then rejected,
# and fixing it for one broke it for the other.
repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # "ruff-check" since ruff 0.13; the old "ruff" id still works but warns.
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Only the application code is type checked; see pyproject.toml.
        files: ^app/
        additional_dependencies: [pydantic>=2.6.0, types-requests]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
