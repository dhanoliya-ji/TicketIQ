[project]
name = "ticketiq"
version = "1.0.0"
description = "Self-optimizing support ticket triage agent."
requires-python = ">=3.10"

# ---------------------------------------------------------------------------
# black: code formatter. 100 characters keeps the pipeline code readable
# without forcing awkward line breaks.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]

# ---------------------------------------------------------------------------
# ruff: linter.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # common bugs (bugbear)
    "UP",  # outdated syntax
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use assert-heavy, longer helper functions.
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
